name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build and install package with SQL resources
        run: python -m pip install .
      - name: Installed package and SQL resources outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          trustflow generate-demo --count 10 --output installed-demo
          trustflow ingest installed-demo --data-dir installed-store
          trustflow audit --data-dir installed-store
          trustflow rebuild --data-dir installed-store --destination installed-rebuilt
          trustflow report --data-dir installed-store --as-of 2025-01-16T00:00:00Z --output installed-report
          trustflow verify-export installed-report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check trustflow tests benchmarks
      - run: ruff format --check trustflow tests benchmarks
