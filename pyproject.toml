[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trustflow-data-pipeline"
version = "0.2.0"
description = "Auditable Python and SQL pipeline for digital-signature workflow events"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
trustflow = "trustflow.cli:main"

[tool.setuptools.packages.find]
include = ["trustflow*"]

[tool.setuptools.package-data]
trustflow = ["sql/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
